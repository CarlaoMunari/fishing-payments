{% extends "base.html" %}
{% block content %}
<div class="form-container">
    <h2>Cadastrar Nova Equipe</h2>
    <form action="{{ url_for('register') }}" method="POST" enctype="multipart/form-data" class="modern-form">
        <div class="form-group">
            <label for="name">Nome da Equipe</label>
            <input type="text" id="name" name="name" required placeholder="Ex: Pescadores Unidos">
        </div>
        
        <div class="form-group">
            <label for="contact">Contato (WhatsApp / Telefone) - Opcional</label>
            <input type="text" id="contact" name="contact" placeholder="(00) 00000-0000">
        </div>
        
        <div class="form-group checkbox-group">
            <input type="checkbox" id="has_ruler" name="has_ruler" value="1">
            <label for="has_ruler">A equipe optou por comprar a <strong>Régua do Circuito</strong>?</label>
        </div>
        
        <div class="form-group checkbox-group">
            <input type="checkbox" id="is_courtesy" name="is_courtesy" value="1" onchange="toggleReceipt()">
            <label for="is_courtesy">Inscrição de <strong>Cortesia</strong> (Isenta de pagamento)</label>
        </div>
        
        <h3 style="margin-top: 1.5rem; margin-bottom: 1rem;">Participantes (4 Obrigatórios)</h3>
        <div class="form-group">
            <label for="participant1">Participante 1</label>
            <input type="text" id="participant1" name="participant1" required placeholder="Nome do Participante 1">
        </div>
        <div class="form-group">
            <label for="participant2">Participante 2</label>
            <input type="text" id="participant2" name="participant2" required placeholder="Nome do Participante 2">
        </div>
        <div class="form-group">
            <label for="participant3">Participante 3</label>
            <input type="text" id="participant3" name="participant3" required placeholder="Nome do Participante 3">
        </div>
        <div class="form-group">
            <label for="participant4">Participante 4</label>
            <input type="text" id="participant4" name="participant4" required placeholder="Nome do Participante 4">
        </div>
        
        <div class="form-group" id="payment-amount-group">
            <label for="payment_amount">Valor do Pagamento (R$)</label>
            <input type="number" id="payment_amount" name="payment_amount" step="0.01" min="0" placeholder="Ex: 250.00" class="file-input">
        </div>
        
        <div class="form-group" id="receipt-group">
            <label for="receipt">Imagem do Comprovante de Pagamento</label>
            <input type="file" id="receipt" name="receipt" accept="image/*,.pdf" required class="file-input">
        </div>
        
        <button type="submit" class="btn btn-large btn-primary w-100">Registrar Equipe</button>
    </form>
</div>

<script>
function toggleReceipt() {
    var isCourtesy = document.getElementById('is_courtesy').checked;
    var receiptGroup = document.getElementById('receipt-group');
    var receiptInput = document.getElementById('receipt');
    var amountGroup = document.getElementById('payment-amount-group');
    var amountInput = document.getElementById('payment_amount');
    
    if(isCourtesy) {
        receiptGroup.style.display = 'none';
        receiptInput.required = false;
        amountGroup.style.display = 'none';
        amountInput.value = '0';
    } else {
        receiptGroup.style.display = 'block';
        receiptInput.required = true;
        amountGroup.style.display = 'block';
    }
}
</script>
{% endblock %}
